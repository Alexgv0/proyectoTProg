<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" >
	<title>Alta de especialidad - salud.uy</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
	<link rel="stylesheet" href="../css/global.css">
	<script src="../js/altaEspecialidad.js" defer></script>
	<script src="../js/global.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar bg-body-tertiary">
			<div class="container">
				<a class="navbar-brand" href="../index.html">salud.uy</a>
				<div class="navbar-nav flex-row gap-3">
					<a class="nav-link" href="../index.html">Inicio</a>
					<a class="nav-link" href="../usuarios/login.html">Iniciar sesión</a>
					<a class="nav-link" href="../usuarios/altaUsuario.html">Registrarse</a>
				</div>
			</div>
		</nav>
	</header>

	<main class="container mt-4">
		<h1 class="mb-4">Alta de especialidad</h1>
		<form id="formAltaEspecialidad">
			<label for="nombre" class="form-label">Nombre:</label>
			<input class="form-control mb-2" type="text" id="nombre" name="nombre" maxlength="50" required>

			<label for="porcentaje" class="form-label">Porcentaje adicional:</label>
			<input class="form-control mb-3" type="number" id="porcentaje" name="porcentaje" min="0" max="100" step="1" required>

			<button class="btn btn-primary" type="submit">Aceptar</button>
			<a class="btn btn-secondary" href="consultaEspecialidad.html">Cancelar</a>
		</form>
	</main>

	<footer class="bg-body-tertiary mt-auto py-3">
	    <div class="container text-center">
	        <p class="mb-0"> &copy; salud.uy - Taller de Programación 2026 - Grupo 57</p>
	    </div>
	</footer>

</body>

</html>
