<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Modificar perfil - salud.uy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
	<link rel="stylesheet" href="../css/global.css">
	<script src="../js/modificarUsuario.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
	    <nav class="navbar bg-body-tertiary">
	        <div class="container">
	
	            <a class="navbar-brand" href="../index.html">salud.uy</a>
	
	            <div class="navbar-nav flex-row gap-3">
	                <a class="nav-link" href="../index.html">Inicio</a>
	                <a class="nav-link" href="consultaUsuario.html">Consultar usuario</a>
	                <a class="nav-link" href="perfilUsuario.html">Mi perfil</a>
	                <a class="nav-link" href="../index.html">Cerrar sesión</a>
	            </div>
	
	        </div>
	    </nav>
	</header>
	
    <main class="container mt-4">
    	<h2 class="mb-4">Modificar perfil</h2>
        <div class="col-md-10 col-lg-8">
		    <form id="formModificarUsuario">
		    	<h3 class="mb-3">Información personal</h3>
		    	<div class="mb-3">
		        	<label for="nickname" class="form-label">Nickname:</label>
					<input type="text"
							class="form-control"
					       id="nickname"
					       name="nickname"
					       value="juanperez"
					       readonly>
				</div>
				
				<div class="mb-3">
				<label for="email" class="form-label">Correo electrónico:</label>
				<input type="email"
						class="form-control"
				       id="email"
				       name="email"
				       value="juan@email.com"
				       readonly>
				</div>
				
				<div class="mb-3">
				<label for="nombre" class="form-label">Nombre:</label>
				<input type="text"
						class="form-control"
				       id="nombre"
				       name="nombre"
				       value="Juan"
				       maxlength="50"
				       required>
				</div>
				
				<div class="mb-3">
				<label for="apellido" class="form-label">Apellido:</label>
				<input type="text"
						class="form-control"
				       id="apellido"
				       name="apellido"
				       value="Pérez"
				       maxlength="50"
				       required>
				</div>
				
				<h3 class="mt-4 mb-3">Datos del paciente</h3>
				<div class="mb-3">
				<label for="fechaNacimiento" class="form-label">Fecha de nacimiento: </label>
				<input type="date"
						class="form-control"
				       id="fechaNacimiento"
				       name="fechaNacimiento"
				       value="2000-05-15"
				       required>
				</div>
				
				<div class="mb-3">
				<label for="documento" class="form-label">Número de documento:</label>
				<input type="number"
						class="form-control"
				       id="documento"
				       name="documento"
				       value="12345678"
				       min="1"
				       step="1"
				       required>
				</div>
				
				<div class="mb-3">
				<label for="antecedentes" class="form-label">Antecedentes médicos:</label>
				<textarea id="antecedentes"
				          name="antecedentes"
				          class="form-control">Ninguno</textarea>
				       
				</div>
				
				<div class="mb-3">
				<label for="fechaIngreso" class="form-label">Fecha de ingreso:</label>
				<input type="date"
						class="form-control"
				       id="fechaIngreso"
				       name="fechaIngreso"
				       value="2026-10-01"
				       required>
				</div>
				
				<h3 class="mt-4 mb-3">Cambiar contraseña</h3>
				<div class="mb-3">
				<label for="nuevaContrasenia" class="form-label">Nueva contraseña:</label>
				<input type="password"
						class="form-control"
				       id="nuevaContrasenia"
				       name="nuevaContrasenia">
				</div>
				
				<div class="mb-3">
				<label for="confirmarContrasenia" class="form-label">Confirmar nueva contraseña:</label>
				<input type="password"
						class="form-control"
				       id="confirmarContrasenia"
				       name="confirmarContrasenia">
				</div>
				
				<h3 class="mt-4 mb-3">Imagen de perfil</h3>
				<div class="mb-4">
				<label for="imagen" class="form-label">Nueva imagen:</label>
				<input type="file"
						class="form-control"
				       id="imagen"
				       name="imagen"
				       accept="image/*">
				</div>
				
				<button type="submit" class="btn btn-primary">Guardar cambios</button>
        	</form>
        </div>
    </main>
    
    <footer class="bg-body-tertiary mt-auto py-3">
	    <div class="container text-center">
	        <p class="mb-0"> &copy; salud.uy - Taller de Programación 2026 - Grupo 57</p>
	    </div>
	</footer>
</body>
</html>
