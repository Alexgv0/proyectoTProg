<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Iniciar sesión - salud.uy</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
	<link rel="stylesheet" href="../css/global.css">
	<script src="../js/login.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar bg-body-tertiary">
	        <div class="container">
	
	            <a class="navbar-brand" href="../index.html">salud.uy</a>
	
	            <div class="navbar-nav flex-row gap-3">
	                <a class="nav-link" href="../index.html">Inicio</a>
	                <a class="nav-link" href="login.html">Iniciar sesión</a>
	                <a class="nav-link" href="altaUsuario.html">Registrarse</a>
	            </div>
	
	        </div>
	    </nav>
	</header>
	
	<main class="container mt-4">
		<div class="col-md-8 col-lg-6">
        <h2 class="mb-4">Iniciar sesión</h2>
		<form id="formLogin">
			<div class="mb-3">
                <label for="nickname" class="form-label">Nickname:</label>
                <input type="text"
                       class="form-control"
                       id="nickname"
                       name="nickname"
                       maxlength="50"
                       required>
            </div>

			<div class="mb-3">
                <label for="contrasenia" class="form-label">Contraseña:</label>
                <input type="password"
                       class="form-control"
                       id="contrasenia"
                       name="contrasenia"
                       required>
            </div>
            
			<button type="submit" class="btn btn-primary">Iniciar sesión</button>
		</form>
	</main>
	
	<footer class="bg-body-tertiary mt-auto py-3">
    <div class="container text-center">
        <p class="mb-0">
            &copy; 2026 salud.uy - Taller de Programación 2026 - Grupo 57
        </p>
    </div>
</footer>
</body>

</html>
