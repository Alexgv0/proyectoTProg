<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" >
	<title>Registrarse - salud.uy</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
	<link rel="stylesheet" href="../css/global.css">
	<script src="../js/altaUsuario.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar bg-body-tertiary">
			<div class="container">
				<a class="navbar-brand" href="../index.html">salud.uy</a>
					<a class="nav-link" href="../index.html">Inicio</a>
					<a class="nav-link" href="login.html">Iniciar sesión</a>
					<a class="nav-link" href="altaUsuario.html">Registrarse</a>
			</div>
		</nav>
	</header>
	<main class="container mt-4">
		<h2 class="mb-4">Registro de usuario</h2>
		<form id="formAltaUsuario">
			<div class="mb-3">
				<label for="tipoUsuario" class="form-label">Tipo de usuario:</label>
				<select id="tipoUsuario" name="tipoUsuario" class="form-select" required>
					<option selected disabled value="">Seleccione una opción</option>
					<option value="paciente">Paciente</option>
					<option value="medico">Médico</option>
				</select>
			</div>
			
			<div class="mb-3">
			    <label for="nickname" class="form-label">Nickname:</label>
			    <input type="text"
			           class="form-control"
			           id="nickname"
			           name="nickname"
			           maxlength="50"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="nombre" class="form-label">Nombre:</label>
			    <input type="text"
			           class="form-control"
			           id="nombre"
			           name="nombre"
			           maxlength="50"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="apellido" class="form-label">Apellido:</label>
			    <input type="text"
			           class="form-control"
			           id="apellido"
			           name="apellido"
			           maxlength="50"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="email" class="form-label">Correo electrónico:</label>
			    <input type="email"
			           class="form-control"
			           id="email"
			           name="email"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="contrasenia" class="form-label">Contraseña:</label>
			    <input type="password"
			           class="form-control"
			           id="contrasenia"
			           name="contrasenia"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="confirmarContrasenia" class="form-label">
			        Confirmar contraseña:
			    </label>
			    <input type="password"
			           class="form-control"
			           id="confirmarContrasenia"
			           name="confirmarContrasenia"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="imagen" class="form-label">Imagen de perfil:</label>
			    <input type="file"
			           class="form-control"
			           id="imagen"
			           name="imagen"
			           accept="image/*">
			</div>
			
			<div id="datosPaciente" style="display: none;">
			    <h3>Datos del paciente</h3>
			    <label for="fechaNacimiento">Fecha de nacimiento:</label>
			    <input type="date"
			           id="fechaNacimiento"
			           name="fechaNacimiento">
			    <br>
			    <label for="documento">Número de documento:</label>
			    <input type="number"
			           id="documento"
			           name="documento"
			           min="1"
						step="1">
			    <br>
			    <label for="antecedentes">Antecedentes médicos:</label>
			    <textarea id="antecedentes"
			              name="antecedentes"></textarea>
			</div>
			
			<div id="datosMedico" style="display: none;">
			    <h3>Datos del médico</h3>
			    <label for="numeroRegistro">Número de registro:</label>
			    <input type="number"
       					id="numeroRegistro"
       					name="numeroRegistro"
      					min="1"
       					step="1">
			    <br>
			    <label for="mesLicencia">Mes de licencia:</label>
			    <select id="mesLicencia" name="mesLicencia">
			        <option selected disabled value="">Seleccione un mes</option>
			        <option value="enero">Enero</option>
			        <option value="febrero">Febrero</option>
			        <option value="marzo">Marzo</option>
			        <option value="abril">Abril</option>
			        <option value="mayo">Mayo</option>
			        <option value="junio">Junio</option>
			        <option value="julio">Julio</option>
			        <option value="agosto">Agosto</option>
			        <option value="septiembre">Septiembre</option>
			        <option value="octubre">Octubre</option>
			        <option value="noviembre">Noviembre</option>
			        <option value="diciembre">Diciembre</option>
			    </select>
			    <br>
			    <label for="sitioWeb">Sitio web:</label>
			    <input type="url" 
			    		id="sitioWeb" 
			    		name="sitioWeb">
			    <br>
			    <p>Especialidades:</p>
				<input type="checkbox"
				       id="cardiologia"
				       name="especialidades"
				       value="cardiologia">
				<label for="cardiologia">Cardiología</label>
				<br>
				<input type="checkbox"
				       id="pediatria"
				       name="especialidades"
				       value="pediatria">
				<label for="pediatria">Pediatría</label>	
				<br>
				<input type="checkbox"
				       id="medicinaGeneral"
				       name="especialidades"
				       value="medicinaGeneral">
				<label for="medicinaGeneral">Medicina General</label>
			    <br>
			    <label for="porcentajeAdicional">Porcentaje adicional:</label>
			    <input type="number"
			           id="porcentajeAdicional"
			           name="porcentajeAdicional">
			</div>
			<br>
			<button type="submit">Registrarse</button>
		</form>
	</main>
</body>
</html>
