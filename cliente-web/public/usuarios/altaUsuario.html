<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" >
	<title>Registrarse - salud.uy</title>
	<script defer src="../js/altaUsuario.js"></script>
</head>

<body>
	<header>
		<h1>salud.uy</h1>
		<nav>
			<a href="../index.html">Inicio</a>
			<a href="login.html">Iniciar sesión</a>
			<a href="altaUsuario.html">Registrarse</a>
		</nav>
	</header>
	<main>
		<h2>Registro de usuario</h2>
		<form id="formAltaUsuario">
			<label for="tipoUsuario">Tipo de usuario:</label>
			<select id="tipoUsuario" name="tipoUsuario" required>
				<option selected disabled value="">Seleccione una opción</option>
				<option value="paciente">Paciente</option>
				<option value="medico">Médico</option>
			</select>
			<br><br>
			<label for="nickname">Nickname:</label>
			<input type="text" 
					id="nickname" 
					name="nickname" 
					maxlength="50" required> 
			<br>
			<label for="nombre">Nombre:</label>
			<input type="text" 
					id="nombre" 
					name="nombre"
					maxlength="50" required>
			<br>
			<label for="apellido">Apellido:</label>
			<input type="text" 
					id="apellido" 
					name="apellido"
					maxlength="50" required>
			<br>
			<label for="email">Correo electrónico:</label>
			<input type="email" 
					id="email" 
					name="email" required>
			<br>
			<label for="contrasenia">Contraseña:</label>
			<input type="password" 
					id="contrasenia" 
					name="contrasenia" required>
			<br>
			<label for="confirmarContrasenia">Confirmar contraseña:</label>
			<input type="password" 
					id="confirmarContrasenia" 
					name="confirmarContrasenia" required>
			<br>
			<label for="imagen">Imagen de perfil:</label>
			<input type="file" id="imagen" name="imagen" accept="image/*">
			<div id="datosPaciente">
			    <h3>Datos del paciente</h3>
			    <label for="fechaNacimiento">Fecha de nacimiento:</label>
			    <input type="date"
			           id="fechaNacimiento"
			           name="fechaNacimiento">
			    <br>
			    <label for="documento">Número de documento:</label>
			    <input type="number"
			           id="documento"
			           name="documento"
			           min="1"
						step="1">
			    <br>
			    <label for="antecedentes">Antecedentes médicos:</label>
			    <textarea id="antecedentes"
			              name="antecedentes"></textarea>
			</div>
			<div id="datosMedico">
			    <h3>Datos del médico</h3>
			    <label for="numeroRegistro">Número de registro:</label>
			    <input type="number"
       					id="numeroRegistro"
       					name="numeroRegistro"
      					min="1"
       					step="1">
			    <br>
			    <label for="mesLicencia">Mes de licencia:</label>
			    <select id="mesLicencia" name="mesLicencia">
			        <option selected disabled value="">Seleccione un mes</option>
			        <option value="enero">Enero</option>
			        <option value="febrero">Febrero</option>
			        <option value="marzo">Marzo</option>
			        <option value="abril">Abril</option>
			        <option value="mayo">Mayo</option>
			        <option value="junio">Junio</option>
			        <option value="julio">Julio</option>
			        <option value="agosto">Agosto</option>
			        <option value="septiembre">Septiembre</option>
			        <option value="octubre">Octubre</option>
			        <option value="noviembre">Noviembre</option>
			        <option value="diciembre">Diciembre</option>
			    </select>
			    <br>
			    <label for="sitioWeb">Sitio web:</label>
			    <input type="url" 
			    		id="sitioWeb" 
			    		name="sitioWeb">
			    <br>
			    <p>Especialidades:</p>
				<input type="checkbox"
				       id="cardiologia"
				       name="especialidades"
				       value="cardiologia">
				<label for="cardiologia">Cardiología</label>
				<br>
				<input type="checkbox"
				       id="pediatria"
				       name="especialidades"
				       value="pediatria">
				<label for="pediatria">Pediatría</label>	
				<br>
				<input type="checkbox"
				       id="medicinaGeneral"
				       name="especialidades"
				       value="medicinaGeneral">
				<label for="medicinaGeneral">Medicina General</label>
			    <br>
			    <label for="porcentajeAdicional">Porcentaje adicional:</label>
			    <input type="number"
			           id="porcentajeAdicional"
			           name="porcentajeAdicional">
			</div>
			<br>
			<button type="submit">Registrarse</button>
		</form>
	</main>
</body>
</html>
