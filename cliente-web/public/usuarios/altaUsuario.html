<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" >
	<title>Registrarse - salud.uy</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
	<link rel="stylesheet" href="../css/global.css">
	<script src="../js/altaUsuario.js" defer></script>
	<script src="../js/global.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar bg-body-tertiary">
			<div class="container">
				<a class="navbar-brand" href="../index.html">salud.uy</a>
					<a class="nav-link" href="../index.html">Inicio</a>
					<a class="nav-link" href="login.html">Iniciar sesión</a>
					<a class="nav-link" href="altaUsuario.html">Registrarse</a>
			</div>
		</nav>
	</header>
	<main class="container mt-4">
		<h2 class="mb-4">Registro de usuario</h2>
		<form id="formAltaUsuario">
			<div class="mb-3">
				<label for="tipoUsuario" class="form-label">Tipo de usuario:</label>
				<select id="tipoUsuario" name="tipoUsuario" class="form-select" required>
					<option selected disabled value="">Seleccione una opción</option>
					<option value="paciente">Paciente</option>
					<option value="medico">Médico</option>
				</select>
			</div>
			
			<div class="mb-3">
			    <label for="nickname" class="form-label">Nickname:</label>
			    <input type="text"
			           class="form-control"
			           id="nickname"
			           name="nickname"
			           maxlength="50"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="nombre" class="form-label">Nombre:</label>
			    <input type="text"
			           class="form-control"
			           id="nombre"
			           name="nombre"
			           maxlength="50"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="apellido" class="form-label">Apellido:</label>
			    <input type="text"
			           class="form-control"
			           id="apellido"
			           name="apellido"
			           maxlength="50"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="email" class="form-label">Correo electrónico:</label>
			    <input type="email"
			           class="form-control"
			           id="email"
			           name="email"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="contrasenia" class="form-label">Contraseña:</label>
			    <input type="password"
			           class="form-control"
			           id="contrasenia"
			           name="contrasenia"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="confirmarContrasenia" class="form-label">
			        Confirmar contraseña:
			    </label>
			    <input type="password"
			           class="form-control"
			           id="confirmarContrasenia"
			           name="confirmarContrasenia"
			           required>
			</div>
			
			<div class="mb-3">
			    <label for="imagen" class="form-label">Imagen de perfil:</label>
			    <input type="file"
			           class="form-control"
			           id="imagen"
			           name="imagen"
			           accept="image/*">
			</div>
			
			<div id="datosPaciente">
			    <h3 class="mb-3">Datos del paciente</h3>
			
			    <div class="mb-3">
			        <label for="fechaNacimiento" class="form-label">
			            Fecha de nacimiento:
			        </label>
			        <input type="date"
			               class="form-control"
			               id="fechaNacimiento"
			               name="fechaNacimiento">
			    </div>
			
			    <div class="mb-3">
			        <label for="documento" class="form-label">
			            Número de documento:
			        </label>
			        <input type="number"
			               class="form-control"
			               id="documento"
			               name="documento"
			               min="1"
			               step="1">
			    </div>
			
			    <div class="mb-3">
			        <label for="antecedentes" class="form-label">
			            Antecedentes médicos:
			        </label>
			        <textarea class="form-control"
			                  id="antecedentes"
			                  name="antecedentes"
			                  rows="3"></textarea>
			    </div>
			</div>
			
			<div id="datosMedico">
			    <h3 class="mb-3">Datos del médico</h3>
			
			    <div class="mb-3">
			        <label for="numeroRegistro" class="form-label">
			            Número de registro:
			        </label>
			        <input type="number"
			               class="form-control"
			               id="numeroRegistro"
			               name="numeroRegistro"
			               min="1"
			               step="1">
			    </div>
			
			    <div class="mb-3">
			        <label for="mesLicencia" class="form-label">
			            Mes de licencia:
			        </label>
			
			        <select id="mesLicencia"
			                name="mesLicencia"
			                class="form-select">
				        <option selected disabled value="">Seleccione un mes</option>
				        <option value="enero">Enero</option>
				        <option value="febrero">Febrero</option>
				        <option value="marzo">Marzo</option>
				        <option value="abril">Abril</option>
				        <option value="mayo">Mayo</option>
				        <option value="junio">Junio</option>
				        <option value="julio">Julio</option>
				        <option value="agosto">Agosto</option>
				        <option value="septiembre">Septiembre</option>
				        <option value="octubre">Octubre</option>
				        <option value="noviembre">Noviembre</option>
				        <option value="diciembre">Diciembre</option>
			    	</select>
			    </div>
			    
		        <div class="mb-3">
			        <label for="sitioWeb" class="form-label">
			            Sitio web:
			        </label>
			
			        <input type="url"
			               class="form-control"
			               id="sitioWeb"
			               name="sitioWeb">
			    </div>
				    
			    <div class="mb-3">
				    <label class="form-label">Especialidades:</label>
				
				    <div class="form-check">
				        <input class="form-check-input"
				               type="checkbox"
				               name="especialidades"
				               value="Cardiología"
				               id="cardiologia">
				
				        <label class="form-check-label" for="cardiologia">
				            Cardiología
				        </label>
				    </div>
				
				    <div class="form-check">
				        <input class="form-check-input"
				               type="checkbox"
				               name="especialidades"
				               value="Pediatría"
				               id="pediatria">
				
				        <label class="form-check-label" for="pediatria">
				            Pediatría
				        </label>
				    </div>
				
				    <div class="form-check">
				        <input class="form-check-input"
				               type="checkbox"
				               name="especialidades"
				               value="Medicina General"
				               id="medicinaGeneral">
				
				        <label class="form-check-label" for="medicinaGeneral">
				            Medicina General
				        </label>
				    </div>
				</div>
				
				<div class="mb-3">
				    <label for="porcentajeAdicional" class="form-label">
				        Porcentaje adicional:
				    </label>
				
				    <input type="number"
				           class="form-control"
				           id="porcentajeAdicional"
				           name="porcentajeAdicional"
				           min="0">
				</div>
			</div>

			<button type="submit" class="btn btn-primary">Registrarse</button>
		</form>
	</main>
	
	<footer class="bg-body-tertiary mt-auto py-3">
	    <div class="container text-center">
	        <p class="mb-0">
	            &copy; salud.uy - Taller de Programación 2026 - Grupo 57
	        </p>
	    </div>
	</footer>

</body>
</html>
