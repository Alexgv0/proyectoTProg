<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Perfil de usuario - salud.uy</title>
    <link rel="stylesheet" href="../css/global.css">
    <script defer type="text/javascript" src="../js/perfilUsuario.js"></script>
</head>
<body>
    <header>
        <h1>salud.uy</h1>
        <nav>
            <a href="../index.html">Inicio</a>
        </nav>
    </header>
    <main>
        <h2>Perfil de usuario</h2>
        <a href="modificarUsuario.html">Modificar mis datos</a>
        <section>
		    <h3>Información personal</h3>
		    <img id="imagenPerfil"
			     alt="Imagen de perfil"
			     width="150">
		    <p><strong>Nickname:</strong> <span id="nickname"></span></p>
			<p><strong>Nombre:</strong> <span id="nombre"></span></p>
			<p><strong>Apellido:</strong> <span id="apellido"></span></p>
			<p><strong>Correo electrónico:</strong> <span id="correo"></span></p>
			<p><strong>Fecha de ingreso:</strong> <span id="fechaIngreso"></span></p>
		</section>
        <section>
    		<h3>Datos del paciente</h3>
    		<p><strong>Fecha de nacimiento:</strong> <span id="fechaNacimiento"></span></p>
			<p><strong>Número de documento:</strong> <span id="documento"></span></p>
			<p><strong>Antecedentes médicos:</strong> <span id="antecedentes"></span></p>
		</section>
		<section>
		    <h3>Mis reservas</h3>
		    <ul>
		        <li>
		            <a id="reserva1"></a>
		        </li>
		        <li>
		            <a id="reserva2"></a>
		        </li>
		    </ul>
		</section>
    </main>
</body>
</html>
