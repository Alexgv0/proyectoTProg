<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" >
	<title>Alta de Beneficio Anual- salud.uy</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
	<link rel="stylesheet" href="../css/global.css">
	<script src="../js/altaUsuario.js" defer></script>
	<script src="../js/global.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar bg-body-tertiary">
			<div class="container">
				<a class="navbar-brand" href="../index.html">salud.uy</a>
					<a class="nav-link" href="../index.html">Inicio</a>
					<a class="nav-link" href="perfilUsuario.html">Usuario</a>
			</div>
		</nav>
	</header>
	  
	  <main class="container mt-4">
	<h2 class="mb-4">Alta de beneficio anual</h2>
	<form id="formBeneficio" class="col-md-8 col-lg-6">
		<div class="mb-3">
			<label for="paciente" class="form-label">Paciente:</label>
			<select id="paciente" name="paciente" class="form-select" required>
				<option selected disabled value="">Seleccione un paciente</option>
				<option value="vale23">vale23</option>
				<option value="jperez">jperez</option>
			</select>
		</div>

		<div class="mb-3">
			<label for="anio" class="form-label">Año:</label>
			<input type="number" class="form-control" id="anio" name="anio"
			       min="2000" step="1" value="2026" required>
		</div>

		<div class="mb-3">
			<label for="ordenes" class="form-label">Órdenes de consulta gratuitas:</label>
			<input type="number" class="form-control" id="ordenes" name="ordenes"
			       min="0" step="1" value="0" required>
		</div>

		<div class="mb-3">
			<label for="tickets" class="form-label">Tickets de medicamentos gratuitos:</label>
			<input type="number" class="form-control" id="tickets" name="tickets"
			       min="0" step="1" value="0" required>
		</div>

		<button type="submit" class="btn btn-primary">Aceptar</button>
		<a href="../index.html" class="btn btn-outline-secondary">Cancelar</a>
	</form>
</main>
	
	<footer class="bg-body-tertiary mt-auto py-3">
	    <div class="container text-center">
	        <p class="mb-0">
	            &copy; salud.uy - Taller de Programación 2026 - Grupo 57
	        </p>
	    </div>
	</footer>

</body>
</html>
