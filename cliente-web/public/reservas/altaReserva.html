<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" >
	<title>Reserva de Consulta - salud.uy</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
	<link rel="stylesheet" href="../css/global.css">
	<script src="../js/altaUsuario.js" defer></script>
	<script src="../js/global.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar bg-body-tertiary">
			<div class="container">
				<a class="navbar-brand" href="../index.html">salud.uy</a>
					<a class="nav-link" href="../index.html">Inicio</a>
					<a class="nav-link" href="perfilUsuario.html">Usuario</a>
			</div>
		</nav>
	</header>
	  
	  <main class="container mt-4">
	<h2 class="mb-4">Datos de reserva</h2>
	<form id="formReserva" class="col-md-8 col-lg-6">
		<div class="mb-3">
			<label for="diaConsulta" class="form-label">Día de consulta:</label>
			<select id="diaConsulta" name="diaConsulta" class="form-select" required>
				<option selected disabled value="">Seleccione un día de consulta</option>
				<option value="cardiologia-lunes">Cardiología - Lunes</option>
				<option value="pediatria-martes">Pediatría - Martes</option>
			</select>
		</div>

		<div class="mb-3">
			<label for="consulta" class="form-label">Consulta:</label>
			<select id="consulta" name="consulta" class="form-select" required>
				<option selected disabled value="">Seleccione una consulta</option>
				<optgroup label="Cardiología - Lunes">
					<option value="cardiologia240826">Cardiología 240826</option>
					<option value="cardiologia140926">Cardiología 140926</option>
				</optgroup>
				<optgroup label="Pediatría - Martes">
					<option value="pediatria250826">Pediatría 250826</option>
				</optgroup>
			</select>
		</div>

		<button type="submit" class="btn btn-primary">Reservar</button>
	</form>
</main>
	
	<footer class="bg-body-tertiary mt-auto py-3">
	    <div class="container text-center">
	        <p class="mb-0">
	            &copy; salud.uy - Taller de Programación 2026 - Grupo 57
	        </p>
	    </div>
	</footer>

</body>
</html>
