<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Alta de Consulta</title>
		<meta name="description" content="Se dará de alta una consulta.">

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		
		<link rel="stylesheet" href="../css/global.css">
		<script defer type="text/javascript" src="../js/global.js"></script>
	</head>
	
	<body class="d-flex flex-column min-vh-100">
		<header>
			<nav class="navbar bg-body-tertiary">
		        <div class="container">
		            
		            <a class="navbar-brand" href="../index.html">salud.uy</a>
		
					<div class="navbar-nav flex-row gap-3">
		                <a class="nav-link" href="../index.html">Inicio</a>
		                <a class="nav-link" href="../usuarios/login.html">Iniciar sesión</a>
		                <a class="nav-link" href="../usuarios/altaUsuario.html">Registrarse</a>
		            </div>
		
		        </div>
			</nav>
		</header>
		
		<main class="container mt-4">
		
		    <div class="row justify-content-center">
		        <div class="col-md-8 col-lg-6">
		
		            <h1 class="mb-4">Alta de Consulta</h1>
		            
		            <div class="mb-3">
					    <h2>Selecciona un día de consulta</h2>
					
					    <div class="list-group" id="selectorDiaConsulta">
					        <label class="list-group-item">
					            <input class="form-check-input me-2" type="radio" name="diaConsulta" value="1">
					            Cardiología - Lunes
					        </label>
					
					        <label class="list-group-item">
					            <input class="form-check-input me-2" type="radio" name="diaConsulta" value="2">
					            Pediatría - Martes
					        </label>
					
					        <label class="list-group-item">
					            <input class="form-check-input me-2" type="radio" name="diaConsulta" value="3">
					            Medicina General Central - Miércoles
					        </label>
					        
					        <label class="list-group-item">
					            <input class="form-check-input me-2" type="radio" name="diaConsulta" value="4">
					            Cardiología - Jueves
					        </label>
					    </div>
									
					</div>
		
		            <form>
		
		                <div class="mb-3">
		                    <label class="form-label" for="nombre">Nombre: </label>
		                    <input class="form-control" id="nombre" name="nombre" type="text" required>
		                </div>
		
		                <div class="mb-3">
		                    <label class="form-label" for="fecha">Fecha: </label>
		                    <input class="form-control" id="fecha" name="fecha" type="date" required>
		                </div>
		                
		                <div class="mb-3">
		                    <label class="form-label" for="nroSala">Número de sala: </label>
		                    <input class="form-control" id="nroSala" name="nroSala" type="number" min=0 required>
		                </div>
		
		                <div class="mb-3">
		                    <label class="form-label" for="cantNumeros">Cantidad de números: </label>
		                    <input class="form-control" id="cantNumeros" name="cantNumeros" type="number" min=0 required>
		                </div>
		                
		                <div class="mb-4">
		                    <label class="form-label" for="imagen">Imagen: (opcional) </label>
		                    <input class="form-control" type="file" id="imagen" name="imagen" accept="image/*">
		                </div>
		
		                <button class="btn btn-primary" id="enviar" type="submit">
		                    Crear consulta
		                </button>
		
		            </form>
		
		        </div>
		    </div>
		
		</main>
		
		<footer class="bg-body-tertiary mt-auto py-3">
		    <div class="container text-center">
		        <p class="mb-0"> &copy; salud.uy - Taller de Programación 2026 - Grupo 57</p>
		    </div>
		</footer>
	</body>
</html>
