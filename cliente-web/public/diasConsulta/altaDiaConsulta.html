<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Alta de Dia de Consulta</title>
		<meta name="description" content="Se creará un nuevo dia de consulta.">
	
		<link rel="stylesheet" href="../css/global.css">
		<script defer src="../js/global.js"></script>
	</head>
	
	<body>
		<form>
			<h1>Alta de Dia de Consulta</h1>
			<label for="nombre">Nombre: </label>
			<input id="nombre" type="text">
			<br>
			
			<label for="descripcion">Descripcion: </label>
			<textarea id="descripcion"></textarea>
			<br>
		
			<label for="dia">Dia de la semana: </label>
			<select id="dia" name="dia">
				<option selected disabled>Selecciona un dia</option>
				<option value="lunes">Lunes</option>
				<option value="martes">Martes</option>
				<option value="miercoles">Miercoles</option>
				<option value="jueves">Jueves</option>
				<option value="viernes">Viernes</option>
				<option value="sabado">Sabado</option>
				<option value="domingo">Domingo</option>
			</select>
			<br>
			
			<label for="horaInicio">Hora de inicio: </label>
			<input id="horaInicio" type="time">
			<br>
			
			<label for="especialidad">Especialidad: </label>
			<select id="especialidad" name="especialidad">
				<option selected disabled>Selecciona una especialidad</option>
			</select>
			<br>
			
			<label for="clinica">Clinica: </label>
			<select id="clinica" name="clinica">
				<option selected disabled>Selecciona una clinica</option>
			</select>
			<br>
			
			<label for="imagen">Imagen: </label>
			<input type="file" id="imagen" name="imagen" accept="image/*">
			<br>

			<input id="enviar" type="submit">
		</form>
	</body>
</html>
