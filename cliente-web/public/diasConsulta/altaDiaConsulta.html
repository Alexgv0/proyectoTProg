<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Alta de Dia de Consulta</title>
		<meta name="description" content="Se creará un nuevo dia de consulta.">
	
		<link rel="stylesheet" href="../css/global.css">
		<script defer src="../js/global.js"></script>

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		
	</head>
	
	<body>
		<header>
			<h1>salud.uy</h1>
			<nav>
				<a href="../index.html">Inicio</a>
				<a href="../usuarios/login.html">Iniciar sesión</a>
				<a href="../usuarios/altaUsuario.html">Registrarse</a>
			</nav>
		</header>
		<main class="container mt-4">
		
		    <div class="row justify-content-center">
		        <div class="col-md-8 col-lg-6">
		
		            <h1 class="mb-4">Alta de Día de Consulta</h1>
		
		            <form>
		
		                <div class="mb-3">
		                    <label class="form-label" for="nombre">
		                        Nombre: 
		                    </label>
		                    <input class="form-control" id="nombre" name="nombre" type="text">
		                </div>
		
		                <div class="mb-3">
		                    <label class="form-label" for="descripcion">
		                        Descripción:
		                    </label>
		                    <textarea class="form-control" id="descripcion" name="descripcion" rows="4"></textarea>
		                </div>
		
		                <div class="mb-3">
		                    <label class="form-label" for="dia">
		                        Día de la semana:
		                    </label>
		
		                    <select class="form-select" id="dia" name="dia">
		                        <option selected disabled>Selecciona un día</option>
		                        <option value="lunes">Lunes</option>
		                        <option value="martes">Martes</option>
		                        <option value="miercoles">Miércoles</option>
		                        <option value="jueves">Jueves</option>
		                        <option value="viernes">Viernes</option>
		                        <option value="sabado">Sábado</option>
		                        <option value="domingo">Domingo</option>
		                    </select>
		                </div>
		
		                <div class="mb-3">
		                    <label class="form-label" for="horaInicio">
		                        Hora de inicio:
		                    </label>
		
		                    <input class="form-control" id="horaInicio" name="horaInicio" type="time">
		                </div>
		
		                <div class="mb-3">
		                    <label class="form-label" for="especialidad">
		                        Especialidad:
		                    </label>
		
		                    <select class="form-select" id="especialidad" name="especialidad">
		                        <option selected disabled>Selecciona una especialidad</option>
		                    </select>
		                </div>
		
		                <div class="mb-3">
		                    <label class="form-label" for="clinica">
		                        Clínica:
		                    </label>
		
		                    <select class="form-select" id="clinica" name="clinica">
		                        <option selected disabled>Selecciona una clínica</option>
		                    </select>
		                </div>
		
		                <div class="mb-4">
		                    <label class="form-label" for="imagen">
		                        Imagen:
		                    </label>
		
		                    <input class="form-control" type="file" id="imagen" name="imagen" accept="image/*">
		                </div>
		
		                <button class="btn btn-primary" id="enviar" type="submit">
		                    Crear día de consulta
		                </button>
		
		            </form>
		
		        </div>
		    </div>
		
		</main>
	</body>
</html>
