<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Consulta de Dia de Consulta</title>
		<meta name="description" content="Se consultará un dia de consulta.">

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		
		<link rel="stylesheet" href="../css/global.css">
		<script defer type="text/javascript" src="../js/global.js"></script>
		<script defer type="text/javascript" src="../js/consultaDiaConsulta.js"></script>
	
	</head>
	
	<body class="d-flex flex-column min-vh-100">
		<header class="container">
			<nav class="navbar bg-body-tertiary">
		        <div class="container">
		            
		            <a class="navbar-brand" href="../index.html">salud.uy</a>
		
					<div class="navbar-nav flex-row gap-3">
		                <a class="nav-link" href="../index.html">Inicio</a>
		                <a class="nav-link" href="../usuarios/login.html">Iniciar sesión</a>
		                <a class="nav-link" href="../usuarios/altaUsuario.html">Registrarse</a>
		            </div>
		
		        </div>
			</nav>
		</header>
		
		<main class="container mt-4">
			<div class="row justify-content-center">
				
				<h1 class="mb-4">Consulta de Día de Consulta</h1>
				
				<div class="container mt-4">
				    <h2>Selecciona un día de consulta</h2>
				
				    <div class="list-group" id="selectorDiaConsulta">
				        <label class="list-group-item">
				            <input class="form-check-input me-2" type="radio" name="diaConsulta" value="1">
				            Lunes 5 de octubre - Cardiología - 10:00
				        </label>
				
				        <label class="list-group-item">
				            <input class="form-check-input me-2" type="radio" name="diaConsulta" value="2">
				            Martes 6 de octubre - Pediatría - 14:00
				        </label>
				
				        <label class="list-group-item">
				            <input class="form-check-input me-2" type="radio" name="diaConsulta" value="3">
				            Miércoles 7 de octubre - Medicina general - 09:00
				        </label>
				    </div>
								
				</div>
				
			    <div class="container mt-4">
			    	<h2>Datos del día de consulta</h2>
			    	
			    	<img alt="Imagen del dia de consulta" src="">
			    	<p><strong>Nombre: </strong><span id="nombre"></span></p>
			    	<p><strong>Fecha: </strong><span id="nombre"></span></p>
			    	<p><strong>Número de sala: </strong><span id="nombre"></span></p>
			    	<p><strong>Números disponibles: </strong><span id="nombre"></span></p>
			    	<p><strong>Costo de la consulta: </strong><span id="nombre"></span></p>
			    	
			    	<section id="listaConsultas" class="container mt-4" hidden >
			    		<h3>Consultas asociadas</h3>
				
					    <div class="list-group">
					        <label class="list-group-item">
					            <input class="form-check-input me-2" type="radio" name="consulta" value="1">
					            Cardiología 240826
					        </label>
					
					        <label class="list-group-item">
					            <input class="form-check-input me-2" type="radio" name="consulta" value="2">
					            Pediatría 080926
					        </label>
					
					        <label class="list-group-item">
					            <input class="form-check-input me-2" type="radio" name="consulta" value="3">
					            Medicina General 090926
					        </label>
					    </div>
					    		
					</section>
					
			    </div>
			</div>
		</main>
		
		<footer class="bg-body-tertiary mt-auto py-3">
		    <div class="container text-center">
		        <p class="mb-0"> &copy; 2026 salud.uy - Taller de Programación 2026 - Grupo 57</p>
		    </div>
		</footer>
	</body>
</html>
